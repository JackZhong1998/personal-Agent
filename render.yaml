# Render Blueprint: https://render.com/deploy?repo=https://github.com/JackZhong1998/personal-Agent
# No synthesis at deploy time. This creates only the pronunciation helper.
services:
  - type: web
    name: between-pronunciation
    runtime: docker
    plan: free
    region: singapore
    rootDir: services
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: EDGE_TTS_SECRET
        generateValue: true
